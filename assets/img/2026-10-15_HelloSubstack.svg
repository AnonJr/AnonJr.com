<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Import Permanent Marker Font from Google Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;display=swap');

      .name-text {
        font-family: 'Permanent Marker', 'Comic Sans MS', cursive, sans-serif;
        font-size: 145px;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .label-header {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        text-anchor: middle;
        letter-spacing: 4px;
      }

      .label-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #FFFFFF;
        text-anchor: middle;
        letter-spacing: 2px;
      }
    </style>

    <!-- Drop Shadow for Badge -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Subtle Texture / Inner Shadow for Sticker Feel -->
    <clipPath id="badge-clip">
      <rect x="150" y="75" width="900" height="600" rx="40" ry="40" />
    </clipPath>
  </defs>

  <!-- Canvas Background (Substack / Web Light Gray) -->
  <rect width="900" height="600" fill="#F4F5F7" opacity="0" />

  <!-- Main Sticker Body -->
  <g filter="url(#drop-shadow)">
    <!-- Base White Card -->
    <rect x="150" y="75" width="900" height="600" rx="40" ry="40" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />

    <!-- Blue Top Banner -->
    <path d="M 150,115 A 40,40 0 0,1 190,75 L 1010,75 A 40,40 0 0,1 1050,115 L 1050,250 L 150,250 Z" fill="#0052CC" />

    <!-- Header Text -->
    <text x="600" y="145" class="label-header" font-size="64">HELLO</text>
    <text x="600" y="200" class="label-sub" font-size="28">my name is</text>

    <!-- Blue Bottom Accent Bar -->
    <path d="M 150,635 L 1050,635 L 1050,635 A 40,40 0 0,1 1010,675 L 190,675 A 40,40 0 0,1 150,635 Z" fill="#0052CC" />

    <!-- "Handwritten" Name in Permanent Marker -->
    <!-- Slightly rotated to mimic hand-written badge placement -->
    <g transform="rotate(-1.5 600 440)">
      <text x="600" y="435" class="name-text">AnonJr</text>
    </g>

    <!-- Subtle Peel/Crease Accent (Top Right) -->
    <path d="M 1010,75 L 1050,115 L 1010,115 Z" fill="#003D99" opacity="0.3" />
  </g>
</svg>
